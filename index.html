<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#2b6cb0">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Капли для глаз — расписание</title>
<style>
  :root{
    --bg:#f4f7fb;
    --card:#ffffff;
    --accent:#2b6cb0;
    --accent-dark:#1a4a7a;
    --good:#2f855a;
    --off:#a0aec0;
    --border:#dbe4ee;
    --text:#1a202c;
    --muted:#718096;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
    background:var(--bg);
    color:var(--text);
    line-height:1.45;
    padding:12px;
    padding-bottom:calc(20px + env(safe-area-inset-bottom));
    font-size:16px;
  }
  .wrap{max-width:820px;margin:0 auto;}

  h1{font-size:1.3rem;margin:0 0 2px;letter-spacing:-0.02em;}
  .sub{color:var(--muted);font-size:.85rem;margin-bottom:14px;}

  /* ---------- Вкладки ---------- */
  .tabs{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:6px;
    background:#e2e8f0;
    padding:5px;
    border-radius:14px;
    margin-bottom:14px;
  }
  .tabs button{
    padding:11px 10px;
    border:none;
    border-radius:10px;
    background:transparent;
    color:#4a5568;
    font-size:.95rem;
    font-weight:600;
    cursor:pointer;
    min-height:44px;
    transition:background .15s,color .15s;
  }
  .tabs button.active{
    background:#fff;
    color:var(--accent);
    box-shadow:0 1px 3px rgba(0,0,0,.08);
  }
  .tabs button:active{transform:scale(.99);}

  /* ---------- Блок с датой ---------- */
  .date-box{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:16px;
    padding:14px;
    margin-bottom:14px;
  }
  .date-box .today{
    font-weight:700;
    font-size:1.15rem;
    margin-bottom:12px;
  }
  .date-box .today small{
    display:block;
    font-weight:400;
    color:var(--muted);
    font-size:.8rem;
    margin-top:2px;
  }
  .controls{
    display:grid;
    grid-template-columns:1fr auto;
    gap:8px;
  }
  input[type="date"]{
    width:100%;
    padding:12px 12px;
    border:1px solid var(--border);
    border-radius:11px;
    font-size:1rem;
    background:#fff;
    color:var(--text);
    min-height:48px;
  }
  button{
    padding:12px 16px;
    border:none;
    border-radius:11px;
    background:var(--accent);
    color:#fff;
    font-size:1rem;
    font-weight:600;
    cursor:pointer;
    min-height:48px;
    transition:background .15s;
  }
  button:active{background:var(--accent-dark);}
  button.ghost{
    background:#e2e8f0;
    color:#2d3748;
    grid-column:1 / -1;
  }
  button.ghost:active{background:#cbd5e0;}

  /* ---------- Карточка дня ---------- */
  .day-card{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:16px;
    padding:16px;
    margin-bottom:16px;
  }
  .day-card h2{font-size:1.05rem;margin:0 0 12px;color:var(--muted);font-weight:600;}
  .med{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:12px;
    padding:14px;
    border-radius:12px;
    margin-bottom:10px;
    border:1px solid var(--border);
    background:#fbfdff;
  }
  .med:last-child{margin-bottom:0;}
  .med .name{font-weight:700;font-size:1.05rem;}
  .med .name small{display:block;font-weight:400;color:var(--muted);font-size:.8rem;margin-top:2px;}
  .med .dose{
    font-weight:800;
    font-size:1.15rem;
    white-space:nowrap;
    color:var(--good);
  }
  .med.off{opacity:.55;}
  .med.off .dose{color:var(--off);font-weight:400;font-size:1rem;}

  .empty{
    text-align:center;
    padding:30px 10px;
    color:var(--good);
    font-size:1.2rem;
    font-weight:700;
  }

  /* ---------- Таблица ---------- */
  .table-title{
    font-size:1.05rem;
    font-weight:700;
    margin:0 0 10px;
  }
  table{
    width:100%;
    border-collapse:collapse;
    background:var(--card);
    border-radius:16px;
    overflow:hidden;
    font-size:.92rem;
  }
  thead{background:#eaf1f9;}
  th,td{
    padding:10px 12px;
    border-bottom:1px solid var(--border);
    text-align:left;
  }
  th{font-weight:700;font-size:.82rem;color:#2d3748;}
  td.num{text-align:center;font-weight:700;font-size:1.05rem;}
  .zero{color:var(--off);font-weight:400;}
  tr.today-row{background:#fff8e1;}
  tr.today-row td{font-weight:700;}

  @media (max-width:560px){
    body{padding:10px;font-size:15px;}
    h1{font-size:1.15rem;}

    .controls{grid-template-columns:1fr 1fr;}
    button.ghost{grid-column:1 / -1;}

    table, thead, tbody, tr, td{display:block;}
    thead{display:none;}
    table{background:transparent;border-radius:0;overflow:visible;}
    tbody{display:flex;flex-direction:column;gap:10px;}
    tr{
      background:var(--card);
      border:1px solid var(--border);
      border-radius:14px;
      padding:12px 14px;
    }
    tr.today-row{border-color:#f6c744;background:#fff8e1;}
    td{
      border:none;
      padding:6px 0;
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:12px;
      text-align:right;
    }
    td:first-child{
      font-weight:700;
      font-size:1rem;
      border-bottom:1px solid var(--border);
      padding-bottom:10px;
      margin-bottom:6px;
      display:block;
      text-align:left;
    }
    td.num{font-size:1.1rem;}
    td.num::before{
      content:attr(data-label);
      font-weight:500;
      color:var(--muted);
      font-size:.85rem;
      text-align:left;
    }
  }

  .legend{font-size:.82rem;color:var(--muted);margin-top:10px;text-align:center;}
  .note{font-size:.82rem;color:var(--muted);margin-top:14px;text-align:center;}
</style>
</head>
<body>
<div class="wrap">

  <h1>💧 Капли для глаз</h1>
  <div class="sub" id="subtitle">—</div>

  <!-- ВКЛАДКИ -->
  <div class="tabs" role="tablist">
    <button id="tabRight" class="active" role="tab">👁 Правый глаз</button>
    <button id="tabLeft" role="tab">👁 Левый глаз</button>
  </div>

  <div class="date-box">
    <div class="today">
      <span id="shownDate">—</span>
      <small id="todayMark"></small>
    </div>
    <div class="controls">
      <input type="date" id="datePicker">
      <button id="showBtn">Показать</button>
      <button class="ghost" id="todayBtn">↺ Сегодня</button>
    </div>
  </div>

  <div class="day-card" id="dayCard"></div>

  <div class="table-title">📅 Таблица для сверки</div>
  <table id="tbl">
    <thead>
      <tr id="tblHead">
        <th>Дата</th>
      </tr>
    </thead>
    <tbody id="tbody"></tbody>
  </table>
  <div class="legend">Число = сколько раз в день капать. «—» = не нужно.</div>
  <div class="note" id="note"></div>

</div>

<script>
/* ================== ДАННЫЕ ==================
   Формат: [начало, конец, разВДень], даты включительно
============================================= */
const EYES = {
  right: {
    label: 'Правый глаз',
    meds: [
      {
        key:'signicef',
        name:'Сигницеф',
        sub:'Левофлоксацин',
        periods:[ ['2026-10-14','2026-10-24',4] ]
      },
      {
        key:'kosopt',
        name:'Косопт',
        sub:'Дорзоламид + Тимолол',
        periods:[
          ['2026-10-14','2026-10-29',2],
          ['2026-10-30','2026-11-05',2]
        ]
      },
      {
        key:'nakvan',
        name:'Накван',
        sub:'Бромфенак',
        periods:[ ['2026-10-14','2026-11-13',2] ]
      }
    ]
  },
  left: {
    label: 'Левый глаз',
    meds: [
      {
        key:'signicef',
        name:'Сигницеф',
        sub:'Левофлоксацин',
        periods:[ ['2026-10-20','2026-10-30',4] ]
      },
      {
        key:'kosopt',
        name:'Косопт',
        sub:'Дорзоламид + Тимолол',
        periods:[
          ['2026-10-20','2026-11-04',2],
          ['2026-11-05','2026-11-11',2]
        ]
      },
      {
        key:'diclofenac',
        name:'Диклофенак',
        sub:'НПВС',
        periods:[ ['2026-10-20','2026-11-19',3] ]
      }
    ]
  }
};

/* ================== УТИЛИТЫ ================== */
function parseDate(str){
  const [y,m,d] = str.split('-').map(Number);
  return new Date(y, m-1, d);
}
function fmtISO(date){
  const y = date.getFullYear();
  const m = String(date.getMonth()+1).padStart(2,'0');
  const d = String(date.getDate()).padStart(2,'0');
  return `${y}-${m}-${d}`;
}
function fmtHuman(date){
  return date.toLocaleDateString('ru-RU',{day:'2-digit',month:'long',year:'numeric',weekday:'short'});
}
function addDays(date,n){
  const d = new Date(date);
  d.setDate(d.getDate()+n);
  return d;
}
function sameDay(a,b){
  return a.getFullYear()===b.getFullYear() &&
         a.getMonth()===b.getMonth() &&
         a.getDate()===b.getDate();
}
function doseFor(med, date){
  const iso = fmtISO(date);
  for(const [s,e,n] of med.periods){
    if(iso >= s && iso <= e) return n;
  }
  return 0;
}
function allDays(meds){
  const set = new Set();
  meds.forEach(med=>{
    med.periods.forEach(([s,e])=>{
      let cur = parseDate(s);
      const end = parseDate(e);
      while(cur <= end){
        set.add(fmtISO(cur));
        cur = addDays(cur,1);
      }
    });
  });
  return [...set].sort().map(parseDate);
}

/* ================== СОСТОЯНИЕ ================== */
let currentEye = 'right';
let currentDate = new Date();
currentDate.setHours(0,0,0,0);

/* ================== ОТРИСОВКА ================== */
function renderDay(date, isToday){
  const card = document.getElementById('dayCard');
  const eye = EYES[currentEye];
  document.getElementById('shownDate').textContent = fmtHuman(date);
  document.getElementById('todayMark').textContent =
    isToday ? 'это сегодня' : 'выбранная дата';
  document.getElementById('subtitle').textContent =
    eye.meds.map(m=>m.name).join(' · ');

  let html = `<h2>${isToday ? 'Сегодня капаем:' : 'На эту дату:'}</h2>`;
  let any = false;

  eye.meds.forEach(med=>{
    const n = doseFor(med, date);
    if(n > 0){
      any = true;
      html += `
        <div class="med on">
          <div class="name">${med.name}<small>${med.sub}</small></div>
          <div class="dose">${n} раза</div>
        </div>`;
    } else {
      html += `
        <div class="med off">
          <div class="name">${med.name}<small>${med.sub}</small></div>
          <div class="dose">не нужно</div>
        </div>`;
    }
  });

  if(!any){
    html = `<div class="empty">✅ В этот день капать ничего не нужно</div>`;
  }
  card.innerHTML = html;
}

function renderTableHead(){
  const eye = EYES[currentEye];
  const head = document.getElementById('tblHead');
  head.innerHTML = '<th>Дата</th>' +
    eye.meds.map(m=>`<th>${m.name}</th>`).join('');
}

function renderTable(todayDate){
  const tbody = document.getElementById('tbody');
  const eye = EYES[currentEye];
  tbody.innerHTML = '';
  const days = allDays(eye.meds);
  if(!days.length){
    tbody.innerHTML = '<tr><td colspan="4">Нет данных</td></tr>';
    return;
  }
  const first = addDays(days[0], -1);
  const last  = addDays(days[days.length-1], 1);

  let cur = first;
  while(cur <= last){
    const tr = document.createElement('tr');
    if(sameDay(cur, todayDate)) tr.classList.add('today-row');

    const tdDate = document.createElement('td');
    tdDate.textContent = fmtHuman(cur);
    tr.appendChild(tdDate);

    eye.meds.forEach(med=>{
      const n = doseFor(med, cur);
      const td = document.createElement('td');
      td.classList.add('num');
      td.setAttribute('data-label', med.name);
      if(n > 0){
        td.textContent = String(n);
      } else {
        td.textContent = '—';
        td.classList.add('zero');
      }
      tr.appendChild(td);
    });

    tbody.appendChild(tr);
    cur = addDays(cur,1);
  }
}

/* ================== ЛОГИКА ================== */
function update(date){
  const today = new Date();
  today.setHours(0,0,0,0);
  currentDate = new Date(date);
  currentDate.setHours(0,0,0,0);

  renderDay(currentDate, sameDay(currentDate, today));
  renderTableHead();
  renderTable(today);
  document.getElementById('datePicker').value = fmtISO(currentDate);
  renderNote();
}

function renderNote(){
  const eye = EYES[currentEye];
  const parts = eye.meds.map(med=>{
    const ps = med.periods.map(([s,e,n])=>{
      const ds = parseDate(s), de = parseDate(e);
      const f = d=>d.toLocaleDateString('ru-RU',{day:'2-digit',month:'2-digit'});
      return `${f(ds)}–${f(de)} (${n} р/д)`;
    }).join(', ');
    return `${med.name} ${ps}`;
  });
  document.getElementById('note').textContent = parts.join(' · ') + '.';
}

function switchEye(eyeKey){
  currentEye = eyeKey;
  document.getElementById('tabRight').classList.toggle('active', eyeKey==='right');
  document.getElementById('tabLeft').classList.toggle('active', eyeKey==='left');
  update(currentDate);
}

document.addEventListener('DOMContentLoaded', ()=>{
  const picker = document.getElementById('datePicker');
  const today = new Date();
  today.setHours(0,0,0,0);

  update(today);

  document.getElementById('tabRight').addEventListener('click', ()=>switchEye('right'));
  document.getElementById('tabLeft').addEventListener('click', ()=>switchEye('left'));

  document.getElementById('showBtn').addEventListener('click', ()=>{
    if(!picker.value) return;
    update(parseDate(picker.value));
  });
  document.getElementById('todayBtn').addEventListener('click', ()=>{
    const t = new Date();
    t.setHours(0,0,0,0);
    update(t);
  });
  picker.addEventListener('change', ()=>{
    if(picker.value) update(parseDate(picker.value));
  });
});
</script>
</body>
</html>
